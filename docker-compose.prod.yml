# Lightsail 운영 구성. API/Web 이미지는 GHCR에서 받고 PostgreSQL은 같은 인스턴스에서 실행한다.
# DB 데이터는 /var/lib/cmms/postgres에, 첨부파일은 외부 Object Storage에 둔다.
services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: cmms-node-db
    environment:
      POSTGRES_DB: ${DB_NAME:-cmms}
      POSTGRES_USER: ${DB_USERNAME:-cmms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - "${CMMS_DATA_ROOT:-/var/lib/cmms}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cmms} -d ${DB_NAME:-cmms}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: "${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/cmms-node-api:${IMAGE_TAG:-latest}"
    container_name: cmms-node-api
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSL: "false"
      DB_SYNCHRONIZE: "false"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080, '127.0.0.1')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    image: "${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/cmms-node-web:${IMAGE_TAG:-latest}"
    container_name: cmms-node-web
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
